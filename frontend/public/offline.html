<!doctype html>
<html lang="en-IN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#062418" />
    <title>Offline · FinSage.ai</title>
    <style>
      :root { color-scheme: light; }
      * { box-sizing: border-box; }
      body {
        margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        background: #f6faf7; color: #03140d;
      }
      main { max-width: 380px; text-align: center; }
      img { width: 88px; height: 88px; border-radius: 22px; }
      h1 { margin: 20px 0 8px; font-size: 24px; letter-spacing: -0.02em; }
      p { margin: 0; color: rgba(10, 53, 36, 0.7); line-height: 1.6; }
      button {
        margin-top: 24px; border: 0; border-radius: 999px; padding: 12px 24px; cursor: pointer;
        background: #12b76a; color: #03140d; font-weight: 600; font-size: 15px;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/icon-192.png" alt="FinSage" />
      <h1>You're offline</h1>
      <p>FinSage needs an internet connection for live market data. Reconnect and try again.</p>
      <button onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
